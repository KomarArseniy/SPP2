server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # встроенный DNS Docker; адрес сервера определяется при запросе, а не при старте nginx,
  # поэтому контейнер не падает, если API ещё не поднялся
  resolver 127.0.0.11 valid=10s ipv6=off;

  # файлы до 10 МБ (+ запас на multipart-обвязку)
  client_max_body_size 12m;

  location /api/ {
    set $api_upstream http://server:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA: любой неизвестный путь отдаёт index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
